[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "arbor-registry-runtime"
version = "0.1.0"
description = "Local durable runtime for signed Arbor Registry records"
requires-python = ">=3.11"

[project.scripts]
arbor-openbao-provider = "arbor_registry_runtime.openbao_provider:main"
arbor-systemd-vaultd-bridge = "arbor_registry_runtime.vaultd_bridge:main"
